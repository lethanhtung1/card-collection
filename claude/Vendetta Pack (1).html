<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendetta Pack</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#060913;--panel:#0d1424;--ink:#e8ecf7;--mute:#8d97b3;--gold:#f5c542;--line:#1c2640;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font:400 26px 'Lilita One',sans-serif;color:var(--gold);margin:0;-webkit-text-stroke:1px #1b3a8a;paint-order:stroke fill;letter-spacing:.5px}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:28px;justify-items:center}
.stage{position:relative;width:260px;height:520px;display:grid;place-items:center}
.stage::before{content:"";position:absolute;inset:-40px;background:radial-gradient(closest-side,#5b2d6a55,transparent)}
.pack{position:relative;width:240px;height:420px;border-radius:2px;cursor:pointer;border:0;background:none;padding:0;filter:drop-shadow(0 18px 30px #000a);transition:transform .25s}
.pack:hover{transform:translateY(-6px) rotate(-1deg)}
.pack:focus-visible{outline:3px solid var(--gold);outline-offset:8px}
.half{position:absolute;left:0;right:0;overflow:hidden;transition:transform .7s cubic-bezier(.5,0,.2,1),opacity .7s}
.half>.art{position:absolute;left:0;width:100%;height:420px}
.top{top:0;height:70px;clip-path:polygon(0 8px,3% 0,6% 8px,9% 0,12% 8px,15% 0,18% 8px,21% 0,24% 8px,27% 0,30% 8px,33% 0,36% 8px,39% 0,42% 8px,45% 0,48% 8px,51% 0,54% 8px,57% 0,60% 8px,63% 0,66% 8px,69% 0,72% 8px,75% 0,78% 8px,81% 0,84% 8px,87% 0,90% 8px,93% 0,96% 8px,100% 0,100% 100%,0 100%)}
.bot{top:70px;height:350px;clip-path:polygon(0 0,100% 0,100% 342px,97% 350px,94% 342px,91% 350px,88% 342px,85% 350px,82% 342px,79% 350px,76% 342px,73% 350px,70% 342px,67% 350px,64% 342px,61% 350px,58% 342px,55% 350px,52% 342px,49% 350px,46% 342px,43% 350px,40% 342px,37% 350px,34% 342px,31% 350px,28% 342px,25% 350px,22% 342px,19% 350px,16% 342px,13% 350px,10% 342px,7% 350px,4% 342px,1% 350px,0 342px)}
.bot>.art{top:-70px}
.art{background:#2b1230}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.pack.torn .top{transform:translate(30px,-90px) rotate(14deg);opacity:0}
.pack.torn .bot{transform:translateY(40px);opacity:0}
.pack.shake{animation:sh .5s}
@keyframes sh{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.hint{color:var(--mute);text-align:center;max-width:320px;line-height:1.5;margin:0}
.menu{display:none;gap:10px;flex-wrap:wrap;justify-content:center}
.menu.on{display:flex}
button.btn{font:600 15px 'Be Vietnam Pro',sans-serif;color:#1a1200;background:var(--gold);border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
button.btn.alt{background:transparent;color:var(--ink);border:1px solid #3a476b}
button.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.deck{display:none;position:relative;width:240px;height:340px;perspective:900px}
.deck.on{display:block}
.card{position:absolute;inset:0;cursor:pointer;transform-style:preserve-3d;transition:transform .6s,opacity .4s;border:0;background:none;padding:0;font:inherit;color:inherit}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;overflow:hidden}
.card .b{background:repeating-linear-gradient(45deg,#14306b 0 8px,#193a82 8px 16px);border:6px solid #e8b93a;display:grid;place-items:center;font-size:56px;color:#e8b93a}
.card .f{transform:rotateY(180deg);display:flex;flex-direction:column;padding:12px;border:4px solid var(--c);background:linear-gradient(160deg,var(--g1),var(--g2))}
.card.flip{transform:rotateY(180deg)}
.card.gone{transform:translateX(130%) rotate(18deg);opacity:0;pointer-events:none}
.f .n{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.f .sym{flex:1;display:grid;place-items:center;font-size:100px;line-height:1;text-shadow:0 4px 18px #0008}
.f .d{font-size:12px;line-height:1.4;background:#0006;border-radius:8px;padding:8px}
.f .r{position:absolute;right:10px;bottom:8px;font:400 18px 'Lilita One',sans-serif;color:var(--c)}
.holo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#fff5 45%,#ff9bf055 50%,#8ff5ff55 55%,transparent 70%);background-size:250% 100%;animation:hl 2.4s linear infinite;pointer-events:none}
@keyframes hl{from{background-position:150% 0}to{background-position:-100% 0}}
.count{color:var(--mute);font-size:14px}
.grid{display:none;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.grid.on{display:grid}
.mini{border-radius:8px;border:2px solid var(--c);background:linear-gradient(160deg,var(--g1),var(--g2));aspect-ratio:5/7;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:600}
.mini b{display:block;font-size:32px;line-height:1.1}
.panel{display:none;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel.on{display:block}
.panel h2{margin:0 0 4px;font-size:18px;color:var(--gold)}
.hours{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 0;padding:0;list-style:none}
.hours li{background:#142038;border-radius:10px;padding:10px 12px;font-size:14px}
.hours b{color:var(--gold)}
.stat{color:var(--mute);font-size:13px}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>Vendetta Pack</h1><p>Xé pack cung hoàng đạo, xem vận may hôm nay</p></header>
<main>
  <div class="stage" id="stage">
    <button class="pack" id="pack" aria-label="Chạm vào pack để chọn">
      <div class="half top"><div class="art"><svg id="art1" viewBox="0 0 240 420"></svg></div></div>
      <div class="half bot"><div class="art"><svg id="art2" viewBox="0 0 240 420"></svg></div></div>
    </button>
    <div class="deck" id="deck" aria-live="polite"></div>
  </div>
  <p class="hint" id="hint">Chạm vào pack để chọn: xé thử vận may hay xem giờ hoàng đạo</p>
  <div class="menu" id="menu">
    <button class="btn" id="tear">Xé thử vận may</button>
    <button class="btn alt" id="hours">Xem giờ hoàng đạo</button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="panel" id="panel"></div>
  <div class="menu" id="after"><button class="btn" id="again">Mở pack mới</button></div>
</main>

function toHSL([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2;let h=0,s=0;if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
const hueOf=(rgb,fb)=>{const [h,s]=toHSL(rgb);return s<.16?fb:h};
function buildPack(c){const fb=c.hue??275,put=(t,b)=>{const s=packSVG(c,t,b);$('art1').innerHTML=s;$('art2').innerHTML=s};
put(`hsl(${fb} 78% 42%)`,`hsl(${fb} 60% 9%)`);
Promise.all([avgColor(c.image,0,.2),avgColor(c.image,.7,1)]).then(([a,b])=>put(`hsl(${hueOf(a,fb)} 78% 42%)`,`hsl(${hueOf(b,fb)} 60% 9%)`))}
buildPack(PACKS.find(p=>'#'+p.id===location.hash)||PACKS[0]);
function roll(forceRare){let t=Object.values(RAR).reduce((a,r)=>a+r.w,0),x=Math.random()*t;let ks=forceRare?["R","SR","UR"]:Object.keys(RAR);if(forceRare){t=ks.reduce((a,k)=>a+RAR[k].w,0);x=Math.random()*t}
for(const k of ks){x-=RAR[k].w;if(x<=0)return k}return ks[0]}
let cards=[],idx=0,state='idle';
function cardEl(c,i){const r=RAR[c.r],b=document.createElement('button');b.className='card';b.style.zIndex=100-i;b.style.setProperty('--c',r.c);b.style.setProperty('--g1',r.g1);b.style.setProperty('--g2',r.g2);b.setAttribute('aria-label','Lật thẻ '+(i+1));
b.innerHTML=`<div class="b">✦</div><div class="f ${c.r==='SR'||c.r==='UR'?'holo':''}"><div class="n"><span>${c.s[1]}</span><span>${c.s[0]}</span></div><div class="sym" style="color:${r.c}">${c.s[0]}</div><div class="d">${c.s[2]}</div><span class="r">${r.n}</span></div>`;
if(c.r==='UR'){const f=b.querySelector('.f');f.style.padding='0';f.style.border='0';f.innerHTML=`<img src="${BARON}" alt="Baron Nashor" style="width:100%;height:100%;object-fit:cover">`}
b.onclick=()=>step(b,i);return b}
function open_(){cards=[];for(let i=0;i<10;i++){cards.push({s:SIGNS[Math.floor(Math.random()*12)],r:roll(i===9)})}
deck.innerHTML='';cards.slice().reverse().forEach((c,j)=>deck.appendChild(cardEl(c,9-j)));idx=0;state='cards'}
function step(el,i){if(i!==idx)return;if(!el.classList.contains('flip')){el.classList.add('flip');$('count').textContent=`Thẻ ${i+1}/10 · chạm để sang thẻ tiếp theo`}else{el.classList.add('gone');idx++;if(idx>=10)summary();else $('count').textContent=`Thẻ ${idx+1}/10 · chạm để lật`}}
function summary(){deck.classList.remove('on');const g=$('grid');g.innerHTML='';cards.forEach(c=>{const r=RAR[c.r],d=document.createElement('div');d.className='mini';d.style.cssText=`--c:${r.c};--g1:${r.g1};--g2:${r.g2}`;d.innerHTML=`<div><b style="color:${r.c}">${c.s[0]}</b>${c.s[1]}<br>${r.n}</div>`;g.appendChild(d)});g.classList.add('on');
const best=cards.map(c=>c.r).sort((a,b)=>Object.keys(RAR).indexOf(b)-Object.keys(RAR).indexOf(a))[0];
$('count').textContent='Thẻ hiếm nhất: '+best;$('hint').textContent='Đây là 10 thẻ từ pack của bạn.';$('after').classList.add('on');$('stage').style.display='none'}
const HOURS=["Tý","Sửu","Dần","Mão","Thìn","Tị","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];
const LUCKY=[[0,1,3,6,8,9],[2,3,5,8,10,11],[0,1,4,5,7,10],[0,2,3,6,7,9],[2,4,5,8,9,11],[1,4,6,7,10,11]];
function range(i){const s=(i*2+23)%24,e=(s+2)%24;return `${String(s).padStart(2,'0')}:00 – ${String(e).padStart(2,'0')}:00`}
function showHours(){const n=new Date(),jdn=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5)+2440588,dc=((jdn+1)%12+12)%12,L=LUCKY[dc%6];
$('panel').innerHTML=`<h2>Giờ hoàng đạo hôm nay</h2><div class="stat">Ngày ${HOURS[dc]} · ${n.toLocaleDateString('vi-VN')}</div><ul class="hours">${L.map(i=>`<li><b>Giờ ${HOURS[i]}</b><br>${range(i)}</li>`).join('')}</ul><p class="stat">Tính theo địa chi của ngày, chỉ mang tính tham khảo.</p>`;
$('panel').classList.add('on')}
pack.onclick=()=>{if(state!=='idle')return;state='menu';$('menu').classList.add('on');pack.classList.add('shake');setTimeout(()=>pack.classList.remove('shake'),500)};
$('tear').onclick=()=>{if(state==='cards'||state==='torn')return;state='torn';$('menu').classList.remove('on');$('panel').classList.remove('on');open_();pack.classList.add('torn');setTimeout(()=>{pack.style.display='none';deck.classList.add('on');$('hint').textContent='Chạm vào thẻ để lật';$('count').textContent='Thẻ 1/10 · chạm để lật'},700)};
$('hours').onclick=showHours;
$('again').onclick=()=>{location.reload()};
</script>
